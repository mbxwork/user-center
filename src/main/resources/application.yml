spring:
  application:
    name: user-center
  profiles:
    active: test
server:
  port: 8080
  servlet:
    session:
      timeout: 30m  # 设置session过期时间为30分钟
    context-path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
      logic-delete-field: isDeleted
